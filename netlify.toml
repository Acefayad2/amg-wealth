[build]
  publish = "."
  command = ""

# Serve public Health resources on the AMG origin. Protected Life routes use a
# normal redirect so the exam portal's signed Edge authorization still runs;
# proxying those routes between Netlify sites would bypass that protection.
[[redirects]]
  from = "/health/*"
  to = "https://amg-exam-portal.netlify.app/health/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/course/*"
  to = "https://amg-exam-portal.netlify.app/course/:splat"
  status = 302
  force = true

[[redirects]]
  from = "/login/*"
  to = "https://amg-exam-portal.netlify.app/login/:splat"
  status = 302
  force = true

[[redirects]]
  from = "/practice-assets/*"
  to = "https://amg-exam-portal.netlify.app/practice-assets/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/guides/accident-health.docx"
  to = "https://amg-exam-portal.netlify.app/Accident%20%26%20Health%20Study%20Guide.docx"
  status = 200
  force = true

[[redirects]]
  from = "/guides/life-producer.docx"
  to = "https://amg-exam-portal.netlify.app/Life%20Producer%20Study%20Guide.docx"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
