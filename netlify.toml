[build]
  publish = "."
  command = ""

# Learning routes use normal redirects so the exam portal's signed Edge
# authorization always runs. A 200 proxy here would expose protected pages or
# guide bytes without the portal's host-bound learner session.
[[redirects]]
  from = "/practice"
  to = "https://amg-exam-portal.netlify.app/"
  status = 302
  force = true

[[redirects]]
  from = "/practice/"
  to = "https://amg-exam-portal.netlify.app/"
  status = 302
  force = true

[[redirects]]
  from = "/practice/health"
  to = "https://amg-exam-portal.netlify.app/course/health/"
  status = 302
  force = true

[[redirects]]
  from = "/practice/health/"
  to = "https://amg-exam-portal.netlify.app/course/health/"
  status = 302
  force = true

[[redirects]]
  from = "/health/*"
  to = "/practice/health/:splat"
  status = 302
  force = true

[[redirects]]
  from = "/course/*"
  to = "https://amg-exam-portal.netlify.app/course/:splat"
  status = 302
  force = true

[[redirects]]
  from = "/login/*"
  to = "https://amg-exam-portal.netlify.app/login/:splat"
  status = 302
  force = true

[[redirects]]
  from = "/practice-assets/*"
  to = "https://amg-exam-portal.netlify.app/practice-assets/:splat"
  status = 302
  force = true

[[redirects]]
  from = "/guides/accident-health.docx"
  to = "https://amg-exam-portal.netlify.app/Accident%20%26%20Health%20Study%20Guide.docx"
  status = 302
  force = true

[[redirects]]
  from = "/guides/life-producer.docx"
  to = "https://amg-exam-portal.netlify.app/Life%20Producer%20Study%20Guide.docx"
  status = 302
  force = true

[[redirects]]
  from = "/Accident & Health Study Guide.docx"
  to = "https://amg-exam-portal.netlify.app/Accident%20%26%20Health%20Study%20Guide.docx"
  status = 302
  force = true

[[redirects]]
  from = "/Life Producer Study Guide.docx"
  to = "https://amg-exam-portal.netlify.app/Life%20Producer%20Study%20Guide.docx"
  status = 302
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
