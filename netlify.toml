[build]
  publish = "."
  command = "npm run build"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Send every Agent Portal entry point straight to the live portal.
[[redirects]]
  from = "/agent-portal"
  to = "https://agents.anointedmoneygroup.com/"
  status = 302
  force = true

[[redirects]]
  from = "/agent-portal.html"
  to = "https://agents.anointedmoneygroup.com/"
  status = 302
  force = true

# Serve the bundled /matchups export from the Nov 6 production site.
# Do not proxy this path to the separately deployed broker workspace.

# Short, memorable entry points for the AMG payment checkout.
[[redirects]]
  from = "/pay"
  to = "https://mylaunch.dev/invoice/amg"
  status = 302
  force = true

[[redirects]]
  from = "/checkout"
  to = "https://mylaunch.dev/invoice/amg"
  status = 302
  force = true

[[redirects]]
  from = "/secure-payment"
  to = "https://mylaunch.dev/invoice/amg"
  status = 302
  force = true

# AMG Learning (licensing course, practice tests, study guides) is served from
# this site. Built output is synced from Acefayad2/amg-practice-exam; see
# docs/learning-course.md. /course/* is gated by
# netlify/edge-functions/course-access.ts; /api/access and /api/learning are
# netlify/functions/learning-access.mts and learning.mts.
# The practice app (practice/index.html) is a single-page app; Health is a
# client-side route. Netlify matches /x and /x/ alike, so one rule covers both.
[[redirects]]
  from = "/practice/health"
  to = "/practice/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/health/*"
  to = "/practice/health/"
  status = 302
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/admin/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://jkwhoisuhcbkokwntrfg.supabase.co; base-uri 'none'; form-action 'self'; frame-ancestors 'none'"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
