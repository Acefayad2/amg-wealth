[build]
  publish = "."
  command = "npm run build"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Short, memorable entry points for the AMG payment checkout.
[[redirects]]
  from = "/pay"
  to = "https://mylaunch.dev/invoice/amg"
  status = 302
  force = true

[[redirects]]
  from = "/checkout"
  to = "https://mylaunch.dev/invoice/amg"
  status = 302
  force = true

[[redirects]]
  from = "/secure-payment"
  to = "https://mylaunch.dev/invoice/amg"
  status = 302
  force = true

# Serve public Health resources on the AMG origin. Protected Life routes use a
# normal redirect so the exam portal's signed Edge authorization still runs;
# proxying those routes between Netlify sites would bypass that protection.
[[redirects]]
  from = "/practice"
  to = "https://amg-exam-portal.netlify.app/"
  status = 200
  force = true

[[redirects]]
  from = "/practice/"
  to = "https://amg-exam-portal.netlify.app/"
  status = 200
  force = true

[[redirects]]
  from = "/practice/health"
  to = "https://amg-exam-portal.netlify.app/health/"
  status = 200
  force = true

[[redirects]]
  from = "/practice/health/"
  to = "https://amg-exam-portal.netlify.app/health/"
  status = 200
  force = true

[[redirects]]
  from = "/health/*"
  to = "/practice/health/:splat"
  status = 302
  force = true

[[redirects]]
  from = "/course/*"
  to = "https://amg-exam-portal.netlify.app/course/:splat"
  status = 302
  force = true

[[redirects]]
  from = "/login/*"
  to = "https://amg-exam-portal.netlify.app/login/:splat"
  status = 302
  force = true

[[redirects]]
  from = "/practice-assets/*"
  to = "https://amg-exam-portal.netlify.app/practice-assets/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/guides/accident-health.docx"
  to = "https://amg-exam-portal.netlify.app/Accident%20%26%20Health%20Study%20Guide.docx"
  status = 200
  force = true

[[redirects]]
  from = "/guides/life-producer.docx"
  to = "https://amg-exam-portal.netlify.app/Life%20Producer%20Study%20Guide.docx"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/admin/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://jkwhoisuhcbkokwntrfg.supabase.co; base-uri 'none'; form-action 'self'; frame-ancestors 'none'"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
